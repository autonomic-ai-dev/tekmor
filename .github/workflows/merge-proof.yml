name: Merge proof

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: merge-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof:
    name: Merge proof (tekmor ci)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out the base branch, which supplies the action and tekmor
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: ./trusted
        with:
          approvers: abhiudayg

  comment:
    name: Post the merge proof on the pull request
    needs: proof
    if: always() && needs.proof.result != 'skipped' && needs.proof.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Check out the base branch's comment action
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          sparse-checkout: comment
          persist-credentials: false

      - uses: ./trusted/comment
        with:
          result: ${{ needs.proof.result }}
