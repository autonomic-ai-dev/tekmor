name: Merge proof

on:
  pull_request_target:
    branches: [master]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: merge-proof-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proof:
    name: Merge proof (tekmor ci)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the base branch, which supplies tekmor
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - uses: ./trusted/.github/actions/setup-protoc

      - uses: dtolnay/rust-toolchain@stable

      - name: Build tekmor from the base branch
        run: cargo build --manifest-path trusted/Cargo.toml -p tekmor --all-features --target-dir "$RUNNER_TEMP/tekmor-target"

      - name: Check out the pull request's commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: pr
          save-if: false

      - name: Find a maintainer approval of this exact commit
        id: approval
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          login=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate | jq -rs --arg head "$HEAD_SHA" --arg author "$AUTHOR" '
            add // [] | map(select(.state == "APPROVED" and .commit_id == $head and .user.login != $author
              and (.author_association == "OWNER" or .author_association == "MEMBER" or .author_association == "COLLABORATOR")))
            | last | .user.login // empty')
          echo "login=$login" >> "$GITHUB_OUTPUT"

      - name: Run the base branch's checks against this commit
        working-directory: pr
        env:
          TEKMOR_HOME: ${{ runner.temp }}/tekmor-home
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          APPROVED_BY: ${{ steps.approval.outputs.login }}
        run: |
          set +e
          "$RUNNER_TEMP/tekmor-target/debug/tekmor" ci --base "$BASE_SHA" --approved-by "$APPROVED_BY" --markdown > "$RUNNER_TEMP/proof.md"
          code=$?
          cat "$RUNNER_TEMP/proof.md"
          cat "$RUNNER_TEMP/proof.md" >> "$GITHUB_STEP_SUMMARY"
          exit $code
