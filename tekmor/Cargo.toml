[package]
name = "tekmor"
version = "2.0.0"
edition = "2021"
description = "A proof eval for coding agents: allowlisted checks, receipts and gates"
license = "MIT"
repository = "https://github.com/autonomic-ai-dev/tekmor"
readme = "README.md"
keywords = ["verify", "receipt", "agent", "proof"]
categories = ["command-line-utilities"]

[[bin]]
name = "tekmor"
path = "src/main.rs"



[dependencies]
tekmor-core = { path = "crates/tekmor-core", version = "2.0.0" }
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "6"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "v7"] }
walkdir = "2"
tempfile = "3"
